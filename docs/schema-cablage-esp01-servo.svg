<circle cx="1020" cy="868" r="8" fill="#ef6c00" stroke="#333"/>
<text x="1020" y="898" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">VCC</text>
<text x="60" y="945" font-size="13" fill="#333">GPIO2 doit être à l'état haut au démarrage : si l'ESP démarre mal, ajouter 10 kΩ entre GPIO2 et 3,3 V. GPIO0 : 10 kΩ vers 3,3 V conseillé,</text>
<text x="60" y="965" font-size="13" fill="#333">à la masse uniquement pour flasher au câble. Servo débranché pendant un flash au câble.</text>
<text x="60" y="1003" font-size="13" font-weight="bold" fill="#b71c1c">⚠ Jamais de 5 V sur l'ESP01. Le condensateur C1 absorbe les pics de courant du moteur et évite les redémarrages de l'ESP.</text>
