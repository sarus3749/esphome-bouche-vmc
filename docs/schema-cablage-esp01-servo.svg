<text x="550" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">Câblage ESP01 ↔ servo ES08MA II (bouche VMC)</text>
<text x="550" y="70" text-anchor="middle" font-size="15" fill="#555">Servo alimenté en 5 V, ESP01 en 3,3 V via un régulateur, masse commune. Le signal 3,3 V de GPIO2 suffit pour le servo.</text>
